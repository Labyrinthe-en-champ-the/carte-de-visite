<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johny GUICHARD — Le Labyrinthe En Champ-Thé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --vert-foret: #233827;
      --vert-hover: #1b2d1f;
      --dore: #A38448;
      --dore-light: #F6F3EC;
      --fond: #F7F5F0;
      --blanc: #FFFFFF;
      --texte: #1F2420;
      --gris-texte: #636D64;
      --bordure: #E7E3DA;
      --ombre: 0 10px 30px rgba(35, 56, 39, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--fond);
      color: var(--texte);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--blanc);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 36px 24px 28px;
      box-shadow: var(--ombre);
      border: 1px solid var(--bordure);
      text-align: center;
      position: relative;
    }

    .logo-container {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--dore-light);
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .badge-terroir {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dore);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--vert-foret);
      margin-bottom: 6px;
    }

    .role {
      font-size: 0.95rem;
      color: var(--gris-texte);
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .company {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--vert-foret);
      margin-bottom: 24px;
    }

    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background-color: var(--vert-foret);
      color: var(--blanc);
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(35, 56, 39, 0.25);
      transition: all 0.2s ease;
      margin-bottom: 24px;
    }

    .btn-save:hover {
      background-color: var(--vert-hover);
      transform: translateY(-1px);
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: #FAFAF7;
      border: 1px solid var(--bordure);
      border-radius: 12px;
      text-decoration: none;
      color: var(--texte);
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #F1EFEA;
      border-color: #D3CDC1;
    }

    .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--blanc);
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 18px;
      height: 18px;
      fill: var(--vert-foret);
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--bordure);
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #FAFAF7;
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: var(--dore-light);
      border-color: var(--dore);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    .footer-address {
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--gris-texte);
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Emplacement pour logo.png -->
    <div class="logo-container">
      <img src="logo.png" alt="Logo Le Labyrinthe En Champ-Thé" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <svg style="display:none; width:44px; height:44px; fill:#233827;" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>

        <polyline points="17 21 17 13 7 13 7 21"></polyline>

      Enregistrer dans mes contacts
    </button>

    <div class="links-list">
      <!-- Téléphone Johny -->
      <a class="action-btn" href="tel:+262692523094">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <span>Appeler (+262 692 52 30 94)</span>
      </a>

      <!-- Email Johny -->
      <a class="action-btn" href="mailto:direction@enchampthe.com">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </div>
        <span>direction@enchampthe.com</span>

      <!-- Site web -->
      <a class="action-btn" href="https://enchampthe.com" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <span>Découvrir enchampthe.com</span>
      </a>
    </div>

    <!-- Réseaux Sociaux -->
    <div class="social-row">
      <!-- LinkedIn -->
      <a class="social-btn" href="https://re.linkedin.com/company/le-labyrinthe-en-champ-th%C3%A9" target="_blank" rel="noopener" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="#0A66C2">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.64a1.65 1.65 0 1 0-.01 3.3 1.65 1.65 0 0 0 .01-3.3z"/>
        </svg>
      </a>

      <!-- Instagram -->
      <a class="social-btn" href="https://www.instagram.com/en_champ_the/?hl=fr" target="_blank" rel="noopener" title="Instagram">
        <svg viewBox="0 0 24 24" fill="#E4405F">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
      </a>

      <!-- Facebook -->
      <a class="social-btn" href="https://www.facebook.com/LeLabyrintheEnChampThe/" target="_blank" rel="noopener" title="Facebook">
        <svg viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </a>
    </div>

    <div class="footer-address">
      18 rue Emile Mussard, Grand Coude<br>
      97480 Saint-Joseph, La Réunion
    </div>
  </div>

  <script>
    function downloadVCard() {
      const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Guichard;Johny;;;
FN:Johny Guichard
ORG:Le Labyrinthe En Champ-Thé
TITLE:Chef d'exploitation
TEL;TYPE=CELL,VOICE:+262692523094
EMAIL;TYPE=WORK,INTERNET:direction@enchampthe.com
URL;TYPE=WORK:https://enchampthe.com
ADR;TYPE=WORK:;;18 rue Emile Mussard\\, Grand Coude;Saint-Joseph;;97480;La Réunion
NOTE:Agriculture biologique & agrotourisme à Grand Coude\\, La Réunion.\\nFacebook : https://www.facebook.com/LeLabyrintheEnChampThe/\\nInstagram : https://www.instagram.com/en_champ_the/?hl=fr\\nLinkedIn : https://re.linkedin.com/company/le-labyrinthe-en-champ-th%C3%A9
END:VCARD`;

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'johny-guichard.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
