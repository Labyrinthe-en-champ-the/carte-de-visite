<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts — Le Labyrinthe En Champ-Thé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --vert-foret: #233827;
      --vert-hover: #1b2d1f;
      --dore: #A38448;
      --dore-light: #F6F3EC;
      --fond: #F7F5F0;
      --blanc: #FFFFFF;
      --texte: #1F2420;
      --gris-texte: #636D64;
      --bordure: #E7E3DA;
      --ombre: 0 10px 30px rgba(35, 56, 39, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--fond);
      color: var(--texte);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
    }

    .card {
      background: var(--blanc);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 36px 24px 28px;
      box-shadow: var(--ombre);
      border: 1px solid var(--bordure);
      text-align: center;
    }

    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--dore-light);
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .badge-terroir {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dore);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--vert-foret);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: var(--gris-texte);
      margin-bottom: 24px;
    }

    /* Sélecteur de profil */
    .profiles-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: #FAFAF7;
      border: 1px solid var(--bordure);
      border-radius: 14px;
      text-decoration: none;
      color: var(--texte);
      text-align: left;
      transition: all 0.2s ease;
    }

    .profile-card:hover {
      background: var(--dore-light);
      border-color: var(--dore);
      transform: translateY(-2px);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--vert-foret);
    }

    .profile-role {
      font-size: 0.82rem;
      color: var(--gris-texte);
      line-height: 1.3;
    }

    .arrow-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blanc);
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .arrow-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--vert-foret);
    }

    /* Liens secondaires */
    .site-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--vert-foret);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .site-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* Barre sociale */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed var(--bordure);
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #FAFAF7;
      border: 1px solid var(--bordure);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: var(--dore-light);
      border-color: var(--dore);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer-address {
      margin-top: 22px;
      font-size: 0.8rem;
      color: var(--gris-texte);
      line-height: 1.45;
    }
  </style>
</head>
<body>
